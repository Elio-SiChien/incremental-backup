<svg xmlns="http://www.w3.org/2000/svg" width="640" height="514" viewBox="0 0 640 514" role="img" aria-labelledby="title desc">
  <title id="title">工作盘到移动硬盘的增量备份</title>
  <desc id="desc">读取工作盘，只复制新增和改动到移动硬盘。覆盖前保留旧版本，完成后校验。</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ed}.label{fill:#0f172a}.muted{fill:#52647a}.accent{fill:#2563eb}.line{stroke:#94a3b8}.history{fill:#ecfdf5;stroke:#a7d8c7}.history-text{fill:#176552}
    text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#303b49}.label{fill:#e6edf3}.muted{fill:#a6b5c7}.accent{fill:#79aaff}.line{stroke:#6c819b}.history{fill:#122b27;stroke:#28594c}.history-text{fill:#8fe0c2}}
  </style>
  <rect class="bg" width="640" height="514" rx="16"/>
  <rect class="card" x="24" y="20" width="592" height="116" rx="12"/>
  <text class="accent" x="48" y="56" font-size="18" font-weight="700">01</text>
  <text class="label" x="98" y="59" font-size="28" font-weight="700">工作盘 · 主版本</text>
  <text class="muted" x="98" y="101" font-size="24">文件留在源目录，按内容比较</text>
  <rect class="card" x="24" y="164" width="592" height="116" rx="12"/>
  <text class="accent" x="48" y="200" font-size="18" font-weight="700">02</text>
  <text class="label" x="98" y="203" font-size="28" font-weight="700">只复制新增与改动</text>
  <text class="muted" x="98" y="245" font-size="24">相同文件跳过，不重复传输</text>
  <rect class="card" x="24" y="308" width="592" height="116" rx="12"/>
  <text class="accent" x="48" y="344" font-size="18" font-weight="700">03</text>
  <text class="label" x="98" y="347" font-size="28" font-weight="700">移动硬盘 · 副本</text>
  <text class="muted" x="98" y="389" font-size="24">保留独有文件，复制后校验</text>
  <path class="line" d="M320 141v16m-6-6 6 6 6-6M320 285v16m-6-6 6 6 6-6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="history" x="24" y="446" width="592" height="48" rx="10"/>
  <text class="history-text" x="320" y="478" font-size="23" font-weight="700" text-anchor="middle">覆盖前归档旧版本到 .versions 目录</text>
</svg>
